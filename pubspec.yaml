name: dawal2
description: "Dawal version Android studio 20240209."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+5
#
environment:
  sdk: '>=3.2.6 <4.0.0'
#
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Liens
  url_launcher: ^6.3.0
  # json
  json_annotation: ^4.9.0
  # Audio
  just_audio: ^0.9.38
  # HTTP
  http: ^1.2.1

###
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  ######## fait le 20240209 ############
  flutter_launcher_icons: ^0.13.1
  # json
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

#
flutter:
  uses-material-design: true

  ######## fait le 20240123 ############
  fonts:
    - family: Amazigh tms
      fonts:
        - asset: assets/fonts/MZTIMENR.TTF
    - family: Amazigh arial bold
      fonts:
        - asset: assets/fonts/MZARIALB.TTF
  #
  assets:
    - assets/images/
    - assets/images/lettres/
    - assets/audio_lettres/
    - assets/audio_exemples/
    - assets/json/lettres.json
